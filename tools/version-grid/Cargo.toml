[package]
name = "wt-benchmarks-version-grid"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "wt_benchmarks"
path = "src/lib.rs"

[features]
default = []
historical-grid = []

[dependencies]
derive_more = { version = "2", features = ["from", "error", "display", "debug", "into"] }
eyre = "0.6"
futures = "0.3"
rkyv = { version = "0.8", features = ["uuid-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = "1"
worktable = { version = "^1.0.0-beta" }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "moe_pgo"
path = "../../benches/moe_pgo.rs"
harness = false

[[bench]]
name = "concurrent_mix"
path = "../../benches/concurrent_mix.rs"
harness = false

[[bin]]
name = "agentcode-worktable"
path = "../../src/bin/agentcode-worktable.rs"

[workspace]
