[package]
name = "wt-benchmarks"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reproducible benchmark suite for WorkTable and comparable embedded data structures"
publish = false

[features]
default = ["worktable-adapter"]
worktable-adapter = ["dep:worktable"]
versioned-row-publication = ["worktable-adapter", "worktable/versioned-row-publication"]
redb-adapter = ["dep:redb", "dep:tempfile"]
sqlite-adapter = ["dep:rusqlite"]
lmdb-adapter = ["dep:heed", "dep:tempfile"]
duckdb-adapter = ["dep:duckdb", "dep:tempfile"]
external-adapters = ["redb-adapter", "sqlite-adapter", "lmdb-adapter", "duckdb-adapter"]

[dependencies]
dashmap = "6"
derive_more = { version = "2.0.1", features = ["from", "error", "display", "debug", "into"] }
eyre = "0.6"
futures = "0.3"
parking_lot = "0.12"
# bundled: compile DuckDB from source into the binary — no system lib, portable
# to the Linux paper box.
duckdb = { version = "1", features = ["bundled"], optional = true }
heed = { version = "0.20", optional = true }
redb = { version = "4.1.0", optional = true }
rkyv = { version = "0.8.9", features = ["uuid-1"] }
rusqlite = { version = "0.40.1", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = "1"
worktable = { path = "../WorkTable", optional = true }

# The local worktable crate pins WorkTablesIndex to a git rev that adds the
# positional node-deletion primitive (NodeLike::delete_at). This standalone
# crate must mirror that pin, or it resolves the published 0.0.4 from crates.io
# and fails to compile the worktable lib.
[patch.crates-io]
WorkTablesIndex = { git = "https://github.com/pathscale/WorkTablesIndex.git", rev = "6f408010553600ed5eeb8913608b1d779dbff258" }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }

# KV throughput bench (Criterion Throughput::Elements). External engines behind
# their adapter features; run e.g. `cargo bench --bench kv --features external-adapters`.
[[bench]]
name = "kv"
harness = false

# YCSB two-port bench: throughput (Throughput::Elements) + latency (p99).
[[bench]]
name = "ycsb"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[[bin]]
name = "kv-redb"
path = "src/bin/kv-redb.rs"
required-features = ["redb-adapter"]

[[bin]]
name = "kv-worktable"
path = "src/bin/kv-worktable.rs"

[[bin]]
name = "kv-sqlite"
path = "src/bin/kv-sqlite.rs"
required-features = ["sqlite-adapter"]

[[bin]]
name = "kv-lmdb"
path = "src/bin/kv-lmdb.rs"
required-features = ["lmdb-adapter"]

[[bin]]
name = "kv-duckdb"
path = "src/bin/kv-duckdb.rs"
required-features = ["duckdb-adapter"]

[[bin]]
name = "speedtest1-worktable"
path = "src/bin/speedtest1-worktable.rs"

[[bin]]
name = "speedtest1-sqlite"
path = "src/bin/speedtest1-sqlite.rs"
required-features = ["sqlite-adapter"]

[[bin]]
name = "ycsb-sqlite"
path = "src/bin/ycsb-sqlite.rs"
required-features = ["sqlite-adapter"]

[[bin]]
name = "linkbench-worktable"
path = "src/bin/linkbench-worktable.rs"
