[package]
name = "wt-benchmarks"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reproducible benchmark suite for WorkTable and comparable embedded data structures"
publish = false

[features]
default = ["worktable-adapter"]
worktable-adapter = ["dep:worktable"]
versioned-row-publication = ["worktable-adapter", "worktable/versioned-row-publication"]
# `PartitionSet::pinned` arrived in worktable 1.0.0-beta.16. Off by default so
# this crate still builds against the published release; the partition_ticks
# bench simply offers two routing strategies instead of three without it.
partition-pinned = ["worktable-adapter"]
# Builds only the version-stable PGO grid and adapts pre-beta17 synchronous
# inserts. Used exclusively with an explicit local WorkTable patch path.
historical-grid = ["worktable-adapter"]
redb-adapter = ["dep:redb", "dep:tempfile"]
sqlite-adapter = ["dep:rusqlite"]
lmdb-adapter = ["dep:heed", "dep:tempfile"]
duckdb-adapter = ["dep:duckdb", "dep:tempfile"]
external-adapters = ["redb-adapter", "sqlite-adapter", "lmdb-adapter", "duckdb-adapter"]

[dependencies]
arctic = { package = "arctic-wt", version = "^0.1, >=0.1.9" }
# WorkTablesIndex directly, so benches/arctic_paths.rs can call its BTreeMap on the same
# footing as std and Arctic rather than through worktable's macro.
# `concurrent` is on so benches/arctic_concurrent.rs can put WorkTablesIndex's own
# concurrent map next to Arctic's. It is not an extra build: `worktable` already enables it.
worktables_index = { package = "WorkTablesIndex", version = "^0.0, >=0.0.11", features = [
    "concurrent",
] }
dashmap = "6"
derive_more = { version = "2", features = ["from", "error", "display", "debug", "into"] }
eyre = "0.6"
futures = "0.3"
parking_lot = "0.12"
# bundled: compile DuckDB from source into the binary — no system lib, portable
# to the Linux paper box.
duckdb = { version = "1", features = ["bundled"], optional = true }
heed = { version = "0.20", optional = true }
redb = { version = "4", optional = true }
rkyv = { version = "0.8", features = ["uuid-1"] }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = "1"
# Deliberately spans the local historical worktrees used by the version grid.
# Validation selects the beta18 checkout with command-line Cargo `--config`
# patches; the comparison script substitutes beta13 or beta15 worktrees. No
# repository-local patch configuration is committed.
worktable = { version = ">=1.0.0-beta.13, <1.0.0-beta.19", optional = true }
worktable-vec = { version = "^0.1" }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
tempfile = "3"

# KV throughput bench (Criterion Throughput::Elements). External engines behind
# their adapter features; run e.g. `cargo bench --bench kv --features external-adapters`.
[[bench]]
name = "kv"
harness = false

# KV + embedded-JSON bench: typed columns (WorkTable) vs serde_json blob per key
# (redb, lmdb) — the durable-jank tier modeled on omicron / pict-rs.
[[bench]]
name = "kv_json"
harness = false

# YCSB two-port bench: throughput (Throughput::Elements) + latency (p99).
[[bench]]
name = "ycsb"
harness = false

# Non-unique secondary index across the backends that support one (congee
# cannot). Three arms so backend and key type separate: wti_u128 vs
# arctic_u128 is the backend, wti_string vs wti_u128 is the key type.
[[bench]]
name = "nonunique"
harness = false

# Non-unique index insert and read against key fan-out: fixed row count, rising
# rows-per-key. Guards the scan-inside-insert shape that WorkTablesIndex 0.0.8
# shipped. `cargo bench --bench fanout`.
[[bench]]
name = "fanout"
harness = false

# The three delete APIs against batch size and key distribution. Scattered keys
# run two arms because delete_range cannot express them; contiguous keys run
# three. `cargo bench --bench deletes`.
[[bench]]
name = "deletes"
harness = false

# Mixed read/write across threads, per index backend. Adapted from the bench
# that lived in WorkTablesIndex, reframed at table level so arctic and congee
# can appear at all. `cargo bench --bench concurrent_mix`.
[[bench]]
name = "concurrent_mix"
harness = false

[[bin]]
name = "op-latency-worktable"
path = "src/bin/op-latency-worktable.rs"
required-features = ["worktable-adapter"]

[[bin]]
name = "agentcode-worktable"
path = "src/bin/agentcode-worktable.rs"
required-features = ["worktable-adapter"]

[[bin]]
name = "moe-resident-index-ab"
path = "src/bin/moe-resident-index-ab.rs"
required-features = ["worktable-adapter"]

[[bin]]
name = "moe-resident-build-ab"
path = "src/bin/moe-resident-build-ab.rs"
required-features = ["worktable-adapter"]

[[bin]]
name = "moe-resident-memory-ab"
path = "src/bin/moe-resident-memory-ab.rs"
required-features = ["worktable-adapter"]

[[bin]]
name = "moe-resident-hot-page-ab"
path = "src/bin/moe-resident-hot-page-ab.rs"
required-features = ["worktable-adapter"]

[[bin]]
name = "moe-resident-persist-ab"
path = "src/bin/moe-resident-persist-ab.rs"
required-features = ["worktable-adapter"]

# What vacuum costs the foreground while it runs. Each cell measured twice,
# with vacuum stopped and running; the delta is the point.
# Does vacuum stay out of the way under load, and still return everything
# once the load stops? Two phases: pressure, then quiet.
[[bin]]
name = "vacuum-yield-worktable"
path = "src/bin/vacuum-yield-worktable.rs"
required-features = ["worktable-adapter"]

[[bin]]
name = "vacuum-stress-worktable"
path = "src/bin/vacuum-stress-worktable.rs"
required-features = ["worktable-adapter"]

[[bin]]
name = "delete-cost-worktable"
path = "src/bin/delete-cost-worktable.rs"
required-features = ["worktable-adapter"]

# The agentcode storage profile: generational publish (persisted against
# memory), incremental update, generation scan, dependency walk.
# `cargo bench --bench codegraph`.
[[bench]]
name = "codegraph"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[[bin]]
name = "kv-redb"
path = "src/bin/kv-redb.rs"
required-features = ["redb-adapter"]

[[bin]]
name = "kv-worktable"
path = "src/bin/kv-worktable.rs"

[[bin]]
name = "kv-sqlite"
path = "src/bin/kv-sqlite.rs"
required-features = ["sqlite-adapter"]

[[bin]]
name = "kv-lmdb"
path = "src/bin/kv-lmdb.rs"
required-features = ["lmdb-adapter"]

[[bin]]
name = "kv-duckdb"
path = "src/bin/kv-duckdb.rs"
required-features = ["duckdb-adapter"]

[[bin]]
name = "speedtest1-worktable"
path = "src/bin/speedtest1-worktable.rs"

[[bin]]
name = "speedtest1-sqlite"
path = "src/bin/speedtest1-sqlite.rs"
required-features = ["sqlite-adapter"]

[[bin]]
name = "ycsb-sqlite"
path = "src/bin/ycsb-sqlite.rs"
required-features = ["sqlite-adapter"]

[[bin]]
name = "linkbench-worktable"
path = "src/bin/linkbench-worktable.rs"

# Partition routing under concurrent readers and live partition churn: the tick
# loop the partitioned tables exist for. Unlike WorkTable's own
# `partition_routing` microbenchmark this does real table reads and retires
# partitions while the readers run, so the routing cost is measured against the
# work it sits on and the grace period is actually exercised.
# Run with `--features partition-pinned` to include the batched `pinned` path
# (needs worktable 1.0.0-beta.16 or newer).
[[bench]]
name = "partition_ticks"
harness = false

# The MoE-PGO phase profile: a read-modify-write storm with no locality over
# the whole neuron key set, plus versioned map publication and retirement while
# readers continuously resolve the current map.
[[bench]]
name = "moe_pgo"
harness = false

# The MoE-PGO bulk companion: build one dense map with per-row insert versus
# insert_many, then retire it with per-row delete, delete_many, or delete_range.
[[bench]]
name = "moe_pgo2"
harness = false
[[bench]]
name = "arctic_paths"
harness = false

# Probe order as the independent variable, across std `BTreeMap`, Arctic
# `SequentialMap` and WorkTablesIndex, at every size the sibling
# `arctic_paths` bench uses. In key order, seeded shuffle, one fixed key, and
# YCSB Zipf 0.99. Read as a ratio to each backend's own in-order arm; carries a
# null twin per order because the floor is not one number.
[[bench]]
name = "probe_order"
harness = false

# Arctic's `ConcurrentMap` against the lock it replaces: `SequentialMap` and
# `std::BTreeMap` behind an `RwLock`, plus WorkTablesIndex's own concurrent map
# and a no-op-SMR floor. Read-mostly, threads 1/2/4/8, same key shape and sizes
# as `arctic_paths` and `probe_order`. Index level, overlapping keys; the
# table-level backend question is `concurrent_mix`.
[[bench]]
name = "arctic_concurrent"
harness = false
